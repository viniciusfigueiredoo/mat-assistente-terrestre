name: Build Android APK & Deploy iPhone PWA (Viva Way v1.0.0)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar na aba Releases do GitHub?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy-iphone-pwa:
    name: Publicar PWA para iPhone (GitHub Pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar Dependências
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Exportar Build Web / PWA (Expo Web)
        working-directory: ./mobile
        env:
          CI: 1
        run: npx expo export --platform web --output-dir dist

      - name: Configurar Manifesto PWA e Meta Tags de Tela Cheia para iPhone (iOS Safari)
        working-directory: ./mobile/dist
        run: |
          touch .nojekyll
          cp ../assets/icon.png ./icon.png
          cp ../assets/icon.png ./apple-touch-icon.png

          cat << 'EOF' > manifest.json
          {
            "name": "Viva Way",
            "short_name": "Viva Way",
            "description": "Viva Way — Módulo Assistente Terrestre (MAT)",
            "start_url": "/mat-assistente-terrestre/",
            "scope": "/mat-assistente-terrestre/",
            "display": "standalone",
            "orientation": "portrait",
            "background_color": "#070B14",
            "theme_color": "#070B14",
            "lang": "pt-BR",
            "icons": [
              {
                "src": "/mat-assistente-terrestre/icon.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "/mat-assistente-terrestre/apple-touch-icon.png",
                "sizes": "1024x1024",
                "type": "image/png"
              }
            ]
          }
          EOF

          node -e '
            const fs = require("fs");
            let html = fs.readFileSync("index.html", "utf8");
            const pwaHead = `
              <meta name="theme-color" content="#070B14" />
              <meta name="apple-mobile-web-app-capable" content="yes" />
              <meta name="mobile-web-app-capable" content="yes" />
              <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
              <meta name="apple-mobile-web-app-title" content="Viva Way" />
              <link rel="apple-touch-icon" href="/mat-assistente-terrestre/apple-touch-icon.png" />
              <link rel="icon" type="image/png" href="/mat-assistente-terrestre/icon.png" />
              <link rel="manifest" href="/mat-assistente-terrestre/manifest.json" />
            `;
            html = html.replace(
              "width=device-width, initial-scale=1, shrink-to-fit=no",
              "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
            );
            html = html.replace("</head>", pwaHead + "\n</head>");
            fs.writeFileSync("index.html", html, "utf8");
          '

      - name: Salvar Artefato PWA Web
        uses: actions/upload-artifact@v4
        with:
          name: VivaWay-PWA-Web
          path: ./mobile/dist

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mobile/dist

      - name: Fazer Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android-apk:
    name: Gerar APK Android & Publicar Release v1.0.0
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Configurar Java JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar Licenças do Android SDK (Pré-instalado no Runner)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configurar Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Dependências do App Mobile
        working-directory: ./mobile
        run: npm install --legacy-peer-deps

      - name: Gerar Projeto Nativo Android (Expo Prebuild)
        working-directory: ./mobile
        env:
          EXPO_NO_GIT_STATUS: 1
          CI: 1
        run: npx expo prebuild --platform android --clean

      - name: Compilar APK Release (Gradle assembleRelease)
        working-directory: ./mobile/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"

      - name: Renomear APK para VivaWay-v1.0.0.apk
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk ./VivaWay-v1.0.0.apk

      - name: Disponibilizar APK nos Artefatos da Execução (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: VivaWay-Android-APK
          path: ./VivaWay-v1.0.0.apk
          if-no-files-found: error

      - name: Remover Release v1.1.0 antiga (se existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.0 --yes --cleanup-tag 2>/dev/null || true

      - name: Publicar Release Oficial v1.0.0 (Android APK + Link PWA iPhone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 'Viva Way v1.0.0 — Módulo Assistente Terrestre (Android & iPhone)'
          body: |
            ## 📱 Viva Way v1.0.0 — Módulo Assistente Terrestre (MAT)

            ### 🤖 Como instalar no Android (`.apk`)
            1. Baixe o arquivo **`VivaWay-v1.0.0.apk`** anexado abaixo (em *Assets*).
            2. Toque no arquivo baixado e confirme a instalação.

            ---

            ### 🍎 Como instalar no iPhone / iOS (Web App PWA)
            1. Abra o **Safari** no iPhone e acesse:
               👉 **[https://viniciusfigueiredoo.github.io/mat-assistente-terrestre/](https://viniciusfigueiredoo.github.io/mat-assistente-terrestre/)**
            2. Toque no ícone **Compartilhar** (quadrado com seta para cima na barra inferior do Safari).
            3. Role para baixo e selecione **"Adicionar à Tela de Início"** (*Add to Home Screen*).
            4. O aplicativo **Viva Way** aparecerá na tela inicial do iPhone com o ícone oficial e abrirá em **tela cheia**!

            ---

            ### 📋 Changelog v1.0.0
            - **Modo Tela Cheia Imersivo (`Android` & `iOS`):** Oculta automaticamente a barra de notificações superior e os botões de navegação inferiores do sistema.
            - **Layout Responsivo Dinâmico:** Orbe central, fontes e cartões de sensores (**`Sensor Frontal`** e **`Sensor Solo`**) ajustados proporcionalmente para qualquer tela.
            - **Reconhecimento de Voz em Português (`pt-BR`):** Captura de voz com detecção automática de pausa (VAD) e integração com o ditado do Safari no iPhone.
            - **Síntese de Voz (TTS) Independente do Modo Silencioso:** Narração contínua no alto-falante principal.
            - **Navegação Ativa com GPS em Tempo Real:** Atualização automática da distância até cada esquina, aviso prévio a 25 m e anúncio automático de curva.
            - **Integração Bluetooth Low Energy (BLE) com ESP32:** Recepção de alertas de **Buraco (`HOLE`)**, **Escada (`STAIRS`)** e **Parede (`WALL`)**.
          files: ./VivaWay-v1.0.0.apk
          draft: false
          prerelease: false
          make_latest: true
